# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dart Sass
        run: npm install --global sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Validate IELTS publication contract
        run: python3 scripts/check_ielts_reading.py
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod tidy
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Cache bilingual voice model
        id: voice-model
        uses: actions/cache@v4
        with:
          path: ~/.cache/blog-voice/kokoro-multi-lang-v1_1
          key: kokoro-v1.1-b78e1ac4
      - name: Download bilingual voice model
        if: steps.voice-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/blog-voice
          curl --fail --location --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_1.tar.bz2 -o "$RUNNER_TEMP/voice.tar.bz2"
          echo "b78e1ac42b852e839cceaafbe88f66806bf5860992d1d7b9a3f2ad1198427aed  $RUNNER_TEMP/voice.tar.bz2" | sha256sum -c -
          tar xf "$RUNNER_TEMP/voice.tar.bz2" -C ~/.cache/blog-voice
      - name: Cache finished recordings
        uses: actions/cache@v4
        with:
          path: ~/.cache/blog-recordings
          key: recordings-${{ hashFiles('scripts/render_reading_audio.py', 'content/posts/ielts-reading/**') }}
          restore-keys: recordings-
      - name: Record IELTS audio editions
        run: |
          python3 -m venv "$RUNNER_TEMP/recording-env"
          "$RUNNER_TEMP/recording-env/bin/pip" install sherpa-onnx==1.12.26 beautifulsoup4 numpy
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          "$RUNNER_TEMP/recording-env/bin/python" scripts/render_reading_audio.py public ~/.cache/blog-voice/kokoro-multi-lang-v1_1 ~/.cache/blog-recordings
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
